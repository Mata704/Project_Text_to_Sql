[project]
name = "text-to-sql-frontend"
version = "0.1.0"
description = "Streamlit frontend for the Text-to-SQL train assistant."
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "requests>=2.32.0",
]

[dependency-groups]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
