[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "project-text-to-sql"
version = "0.1.0"
description = "Interactive first-stage train-question classifier using structured OpenAI outputs."
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "openai>=2.0.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "tiktoken>=0.9.0",
    "chromadb>=1.0.0",
]

[project.scripts]
text-to-sql = "text_to_sql.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/text_to_sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
